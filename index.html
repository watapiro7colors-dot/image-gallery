<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>画像切替ギャラリー</title>
<style>
  body {
    font-size: 22px;        /* 文字を大きく */
    text-align: center;     /* 文字と画像を中央揃え */
    margin: 20px;
    background-color: #f9f9f9; /* 背景色で見やすく */
  }

  button {
    font-size: 20px;        /* ボタン文字を大きく */
    padding: 12px 25px;     /* ボタン自体も大きく */
    margin: 5px;
    cursor: pointer;
    border-radius: 8px;
    border: 2px solid #333;
    background-color: #eee;
    transition: background-color 0.3s;
  }

  button:hover {
    background-color: #ddd; /* ホバーで色変化 */
  }

  img {
    display: none;          /* 最初は非表示 */
    max-width: 600px;       /* 画像を大きく表示 */
    height: auto;           /* 縦横比を維持 */
    border: 2px solid #333; 
    border-radius: 10px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<!-- ボタン -->
<button onclick="showImage('img1')">1の答え</button>
<button onclick="showImage('img2')">2の答え</button>
<button onclick="showImage('img3')">3の答え</button>
<button onclick="showImage('img4')">4の答え</button>
<button onclick="showImage('img5')">5の答え</button>
<button onclick="showImage('img6')">6の答え</button>
<button onclick="showImage('img7')">最後の答え</button>

<br><br>

<!-- 画像 -->
<img id="img1" src="https://raw.githubusercontent.com/watapiro7colors-dot/image/main/2.jpg">
<img id="img2" src="https://raw.githubusercontent.com/watapiro7colors-dot/image/main/3.jpg">
<img id="img3" src="https://raw.githubusercontent.com/watapiro7colors-dot/image/main/4.jpg">
<img id="img4" src="https://raw.githubusercontent.com/watapiro7colors-dot/image/main/5.jpg">
<img id="img5" src="https://raw.githubusercontent.com/watapiro7colors-dot/image/main/6.jpg">
<img id="img6" src="https://raw.githubusercontent.com/watapiro7colors-dot/image/main/7.jpg">
<img id="img7" src="https://raw.githubusercontent.com/watapiro7colors-dot/image/main/8.jpg">

<script>
function showImage(id) {
  const images = document.querySelectorAll("img");
  images.forEach(img => img.style.display = "none"); // 全て非表示
  document.getElementById(id).style.display = "block"; // 選んだ画像だけ表示
}
</script>

</body>
</html>
</body>

</html>
